<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details — NEXORA Store</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- STICKY NAVBAR -->
  <header class="navbar">
    <div class="container navbar-container">
      <a href="index.html" class="logo">
        <div class="logo-icon">N</div>
        <span>NEXORA</span>
      </a>

      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="products.html" class="nav-link active">Shop</a></li>
      </ul>

      <div class="nav-actions">
        <a href="products.html" class="nav-action-btn">🔍</a>
        <a href="profile.html" class="nav-action-btn">❤️</a>
        <a href="cart.html" class="nav-action-btn">🛒<span class="cart-count-badge" style="display:none;">0</span></a>
        <a href="login.html" class="nav-action-btn" id="user-menu-btn">👤</a>
      </div>
    </div>
  </header>

  <!-- MAIN PRODUCT DETAILS CONTENT -->
  <main class="main-content section">
    <div class="container">
      
      <!-- Breadcrumb -->
      <div style="font-size: 0.875rem; color: var(--slate-500); margin-bottom: 2rem;">
        <a href="index.html">Home</a> / <a href="products.html">Shop</a> / <span id="breadcrumb-category">Category</span> / <span id="breadcrumb-title" style="color: var(--slate-900); font-weight: 700;">Product</span>
      </div>

      <!-- Main Product View Container -->
      <div id="product-detail-view">
        <!-- Rendered by product-details.js -->
      </div>

      <!-- Related Products Section -->
      <div id="related-products-section" style="margin-top: 5rem;">
        <h3 style="font-family: var(--font-display); font-size: 1.75rem; font-weight: 800; margin-bottom: 2rem;">Related Products</h3>
        <div class="product-grid" id="related-products-grid"></div>
      </div>

    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <div>© 2026 NEXORA Store. All rights reserved.</div>
      </div>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/products.js"></script>
  <script src="js/product-details.js"></script>
</body>
</html>
