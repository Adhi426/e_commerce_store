<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal — NEXORA Store</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- STICKY NAVBAR -->
  <header class="navbar" style="border-bottom: 2px solid var(--slate-900);">
    <div class="container navbar-container">
      <a href="index.html" class="logo">
        <div class="logo-icon" style="background: var(--slate-900);">👑</div>
        <span>NEXORA <span style="font-size: 0.75rem; font-weight: 700; color: var(--accent-amber); letter-spacing: 0.05em;">ADMIN</span></span>
      </a>

      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">Main Store</a></li>
        <li><a href="admin.html" class="nav-link active">Admin Dashboard</a></li>
      </ul>

      <div class="nav-actions">
        <a href="profile.html" class="nav-action-btn" id="user-menu-btn" title="Admin Profile">👑</a>
      </div>
    </div>
  </header>

  <main class="main-content section">
    <div class="container">
      
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
        <div>
          <span class="badge badge-danger">Administrator Privilege Mode</span>
          <h1 style="font-family: var(--font-display); font-size: 2.25rem; font-weight: 800; color: var(--slate-900); margin-top: 0.25rem;">Store Control Center</h1>
        </div>

        <button onclick="NEXORA_APP.logout()" class="btn btn-outline" style="color: var(--accent-ruby);">Sign Out</button>
      </div>

      <div id="admin-dashboard-view">
        <!-- Rendered by admin.js -->
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <div>© 2026 NEXORA Admin Control Center. All rights reserved.</div>
      </div>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
