<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop All Products — NEXORA Store</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- STICKY NAVBAR -->
  <header class="navbar">
    <div class="container navbar-container">
      <a href="index.html" class="logo">
        <div class="logo-icon">N</div>
        <span>NEXORA</span>
      </a>

      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="products.html" class="nav-link active">Shop</a></li>
        <li><a href="products.html?category=Electronics" class="nav-link">Electronics</a></li>
        <li><a href="products.html?category=Fashion" class="nav-link">Fashion</a></li>
        <li><a href="products.html?category=Accessories" class="nav-link">Accessories</a></li>
      </ul>

      <div class="nav-actions">
        <a href="products.html" class="nav-action-btn" title="Search Products">🔍</a>
        <a href="profile.html" class="nav-action-btn" title="Saved Wishlist">❤️</a>
        <a href="cart.html" class="nav-action-btn" title="Shopping Cart">
          🛒
          <span class="cart-count-badge" style="display: none;">0</span>
        </a>
        <a href="login.html" class="nav-action-btn" id="user-menu-btn" title="User Profile">👤</a>
        
        <button class="mobile-menu-btn">☰</button>
      </div>
    </div>
  </header>

  <!-- MAIN SHOP CONTENT -->
  <main class="main-content section">
    <div class="container">
      
      <!-- Top Search & Sort Header -->
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
        <div>
          <h1 style="font-family: var(--font-display); font-size: 2.25rem; font-weight: 800; color: var(--slate-900);">Product Catalog</h1>
          <p id="products-count" style="color: var(--slate-500); font-size: 0.875rem;">Loading catalog items...</p>
        </div>

        <div style="display: flex; gap: 1rem; align-items: center;">
          <input type="text" id="shop-search-input" placeholder="Search products..." 
                 style="padding: 0.625rem 1rem; border-radius: var(--radius-md); border: 1px solid var(--slate-300); width: 260px;" />

          <select id="sort-select" style="padding: 0.625rem 1rem; border-radius: var(--radius-md); border: 1px solid var(--slate-300); font-weight: 700;">
            <option value="featured">Sort: Featured</option>
            <option value="price_asc">Price: Low to High</option>
            <option value="price_desc">Price: High to Low</option>
            <option value="rating">Highest Rated</option>
            <option value="newest">Newest Arrivals</option>
          </select>
        </div>
      </div>

      <!-- Shop Layout (Sidebar Filters + Products Grid) -->
      <div class="shop-layout">
        <!-- Sidebar Filters -->
        <aside class="filter-card">
          <div class="filter-group">
            <h3 class="filter-title">Categories</h3>
            <ul class="filter-list">
              <li class="filter-item"><button class="filter-category-item active" data-category="All">All Categories</button></li>
              <li class="filter-item"><button class="filter-category-item" data-category="Electronics">Electronics</button></li>
              <li class="filter-item"><button class="filter-category-item" data-category="Fashion">Fashion</button></li>
              <li class="filter-item"><button class="filter-category-item" data-category="Accessories">Accessories</button></li>
              <li class="filter-item"><button class="filter-category-item" data-category="Home & Living">Home & Living</button></li>
              <li class="filter-item"><button class="filter-category-item" data-category="Beauty">Beauty</button></li>
              <li class="filter-item"><button class="filter-category-item" data-category="Sports">Sports</button></li>
            </ul>
          </div>
        </aside>

        <!-- Product Grid Column -->
        <div>
          <div class="product-grid" id="products-grid">
            <!-- Rendered dynamically by products.js -->
          </div>

          <!-- Pagination -->
          <div id="pagination-container" style="display: flex; justify-content: center; gap: 0.5rem; margin-top: 3rem;"></div>
        </div>
      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <div>© 2026 NEXORA Store. All rights reserved.</div>
        <div>CodeAlpha Full Stack Development Task 1</div>
      </div>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/products.js"></script>
</body>
</html>
